<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f3"><title>LAN Drop · 局域网共享</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
:root{color-scheme:light;--bg:#f5f7f3;--ink:#243e30;--muted:#7d8d80;--green:#22865e;--line:#e2e8dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}button,a,textarea,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:9px;padding:11px 17px;background:#eef3ec;color:#365b42;font-weight:600;transition:background .18s}button:hover{background:#e0eadd}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #a0cbb0;outline-offset:3px}.primary{background:var(--green);color:white}.primary:hover{background:#196c4a}main{max-width:1120px;margin:auto;padding:36px 30px 24px}header{display:flex;align-items:center;gap:14px;margin-bottom:28px}.brand-icon{width:48px;height:48px;object-fit:contain;display:block}.brand h1{font-size:25px;letter-spacing:-.8px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:12px}.connection{margin-left:auto;border-radius:20px;background:#e2eee2;padding:8px 13px;font-size:12px;color:#37804d}.connection.offline{background:#fce5df;color:#a64e3d}.hero{padding:25px 28px;border-radius:16px;background:#e7efe3;display:flex;align-items:center;gap:20px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:2px;color:#678466;font-weight:600;margin:0 0 10px}.hero h2{margin:0 0 10px;font-size:27px;letter-spacing:-.8px}.hero p:last-child{color:#6d836c;font-size:13px;margin:0;line-height:1.7}.hero-art{margin-left:auto;width:90px;height:78px;position:relative;flex-shrink:0}.paper{position:absolute;width:42px;height:56px;border:1px solid #abc5aa;border-radius:7px;background:#f4f8ed;left:8px;top:5px;transform:rotate(-14deg)}.paper:after{content:'≡';position:absolute;left:10px;top:10px;font-size:27px;color:#8eb18b}.paper.second{left:37px;top:17px;transform:rotate(14deg);background:#d1e4c9}.layout{display:grid;grid-template-columns:345px minmax(0,1fr);gap:22px}.left{display:flex;flex-direction:column;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:15px}.drop{padding:25px 20px;text-align:center;border:1.5px dashed #c5d5c0;transition:background .2s}.drop.dragging{background:#e0f0df;border-color:var(--green);box-shadow:0 0 0 4px #22865e15}.upload-icon{width:45px;height:45px;margin:0 auto 12px;border-radius:12px;background:#eff5e9;display:grid;place-items:center;color:#61915b;font-size:29px}.drop h3{margin:0 0 8px;font-size:18px}.drop p{margin:0 0 20px;font-size:12px;color:var(--muted)}.drop button{width:100%}.text-card{padding:19px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title h3{margin:0;font-size:15px}.subtle{font-size:12px;padding:6px 10px;background:transparent;color:#6a8a68}textarea{display:block;resize:vertical;min-height:126px;width:100%;border:1px solid #e3e9df;border-radius:9px;background:#fafbf8;color:var(--ink);padding:12px;line-height:1.65;margin:13px 0 9px;outline:none}textarea:focus{border-color:#86b994;box-shadow:0 0 0 3px #22865e10}textarea::placeholder{color:#a1ac9d}.text-hint{color:#929c8c;font-size:11px;display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}.text-card .primary{width:100%}.shared{padding:23px;display:flex;flex-direction:column;min-height:524px}.shared h2{font-size:19px;margin:0 0 7px}.summary{font-size:12px;color:var(--muted);margin:0}.tools{display:flex;align-items:center;justify-content:space-between}.filter{margin-top:21px;display:flex;gap:6px;border-bottom:1px solid #edf0e8;padding-bottom:11px}.filter button{padding:7px 12px;font-size:12px;color:#92a08d;background:transparent}.filter button.active{background:#eaf2e5;color:#4a7845}.search{margin:14px 0 4px;padding:10px 12px;width:100%;border:1px solid #e4eadd;border-radius:8px;background:#fafcf8;outline:none;color:var(--ink)}.search:focus{border-color:#86b994}.file-list{flex:1;max-height:510px;overflow:auto}.file{display:flex;align-items:center;gap:13px;padding:16px 0;border-bottom:1px solid #eff2ec}.file-icon{width:40px;height:46px;border-radius:8px;background:#edf2e7;color:#638056;font-size:10px;font-weight:700;display:grid;place-items:center;flex-shrink:0}.file-icon.binary{background:#eaf0f5;color:#6b8294}.file-info{min-width:0;flex:1}.file-name{font-size:13px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:0 0 6px}.file-meta{font-size:11px;color:#98a191}.file-actions{display:flex;gap:5px;flex-shrink:0}.file-actions button,.file-actions a{font-size:12px;border-radius:7px;padding:7px 9px;text-decoration:none;background:#f0f5eb;color:#55744e;border:0;font-weight:500}.file-actions a:hover{background:#e0eadd}.empty{text-align:center;color:#7e9576;padding:65px 10px}.empty-symbol{font-size:40px;color:#b6c9aa;margin-bottom:16px}.empty h3{font-size:15px;font-weight:500}.empty p{font-size:12px;color:#9ca694}.shared-footer{margin-top:18px;padding-top:13px;font-size:11px;color:#a0aa98;display:flex;justify-content:space-between;gap:8px}footer{margin-top:22px;display:flex;justify-content:space-between;gap:12px;color:#98a28f;font-size:11px;line-height:1.8}footer a{color:#698361;text-decoration:none}footer a:hover{text-decoration:underline}.footer-links{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}.footer-links a{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.gh-icon{flex-shrink:0}#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:13px 22px;max-width:min(90%,700px);background:#294c36;color:white;border-radius:10px;box-shadow:0 8px 28px #263e3020;z-index:10;line-height:1.6;white-space:pre-wrap}#toast.error{background:#8f4635}.progress{margin-top:15px;text-align:left;font-size:12px;color:#53754d}.progress progress{width:100%;height:7px;accent-color:var(--green);margin-top:8px}dialog{width:min(600px,92vw);border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--ink);box-shadow:0 24px 100px #16351b30}dialog::backdrop{background:#19342350;backdrop-filter:blur(3px)}dialog h3{margin:0;word-break:break-all;font-size:16px}dialog textarea{min-height:260px;background:#f7faf3}dialog .actions{display:flex;justify-content:flex-end;gap:10px}.hidden,[hidden]{display:none!important}@media(max-width:760px){main{padding:23px 16px}.layout{grid-template-columns:1fr}.hero{padding:22px}.hero h2{font-size:23px}.hero-art{display:none}.connection{font-size:10px;padding:7px 10px}.shared{min-height:360px;padding:19px}.file-list{max-height:none}.shared-footer,footer{flex-wrap:wrap}.file{gap:10px}.file-actions{gap:4px}.file-actions button,.file-actions a{padding:7px}.left{gap:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header><img class="brand-icon" src="/icon.png" alt="" aria-hidden="true" width="48" height="48"><div class="brand"><h1>LAN Drop</h1><p>就在身边，轻松共享。</p></div><span class="connection" id="connection" role="status">● 正在连接</span></header>
<section class="hero"><div><p class="eyebrow">LOCAL NETWORK · SHARED SPACE</p><h2>文件和想法，近在咫尺。</h2><p>无需登录。同一局域网中的设备，都能在这里分享文件和文字。</p></div><div class="hero-art" aria-hidden="true"><div class="paper"></div><div class="paper second"></div></div></section>
<div class="layout">
<div class="left">
<section class="card drop" id="drop"><div class="upload-icon" aria-hidden="true">↑</div><h3>把文件拖到这里</h3><p>支持多个文件 · 单个最大 10 GiB</p><button id="choose">＋ 选择文件</button><input id="file-input" type="file" multiple hidden><div class="progress" id="progress-area" hidden><span id="progress-label"></span><progress id="progress" max="100" value="0" aria-label="上传进度"></progress></div></section>
<section class="card text-card"><div class="section-title"><h3>分享一段文字</h3><button class="subtle" id="paste">粘贴</button></div><label class="hidden" for="draft">要分享的文字</label><textarea id="draft" placeholder="粘贴一条链接、随手记下的笔记，或任何想分享的文字…" maxlength="1048576"></textarea><div class="text-hint"><span>保存为 .txt 文件 · 最大 1 MiB</span><span id="char-count">0 字</span></div><button class="primary" id="save-text" disabled>保存并共享</button></section>
</div>
<section class="card shared"><div class="tools"><div><h2>共享空间</h2><p class="summary" id="summary">正在读取共享文件…</p></div><button class="subtle" id="refresh">↻ 刷新</button></div><div class="filter" role="group" aria-label="文件类型"><button class="active" data-filter="all" aria-pressed="true">全部文件</button><button data-filter="file" aria-pressed="false">文件</button><button data-filter="text" aria-pressed="false">文字</button></div><input class="search" id="search" placeholder="搜索文件名…" aria-label="搜索文件名"><div class="file-list" id="files" aria-live="polite"></div><div class="shared-footer"><span>所有设备共享同一个 LanDropData 目录</span><span>每 2 秒自动同步</span></div></section>
</div>
<footer><span>● 仅在当前网络内共享 · 请在信任的局域网中使用</span><span class="footer-links"><a id="address" href="/" title="当前共享地址"></a><a href="https://github.com/xusenlin/lan-drop" target="_blank" rel="noopener noreferrer" title="项目源码"><svg class="gh-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>github.com/xusenlin/lan-drop</a></span></footer>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="preview"><h3 id="preview-name"></h3><textarea id="preview-text" readonly aria-label="文字内容"></textarea><div class="actions"><button id="close-preview">关闭</button><button class="primary" id="copy-preview">复制文字</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
let entries=[],filter='all',uploading=false,saving=false,refreshing=false,toastTimer,lastRender='';
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
function toast(message,error=false){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,error?8500:3500)}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'X-Lan-Drop':'1',...options.headers},signal:AbortSignal.timeout(15000)});const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw new Error(response.ok?'服务器响应格式错误':raw||'请求失败')}if(!response.ok)throw new Error(result.error||'请求失败');return result}
function render(){const query=$('search').value.toLocaleLowerCase();const visible=entries.filter(f=>(filter==='all'||(filter==='text'?f.is_text:!f.is_text))&&f.name.toLocaleLowerCase().includes(query));const key=JSON.stringify(visible)+filter+query;if(key===lastRender)return;lastRender=key;$('files').replaceChildren();if(!visible.length){const div=document.createElement('div');div.className='empty';div.innerHTML='<div class="empty-symbol">↓</div><h3></h3><p></p>';div.querySelector('h3').textContent=entries.length?'没有找到匹配的文件':'等一份分享，也可以先传一份';div.querySelector('p').textContent=entries.length?'换个关键词或文件类型试试':'上传的文件和文字会出现在这里';$('files').append(div);return}
for(const file of visible){const row=document.createElement('div');row.className='file';const icon=document.createElement('div');icon.className='file-icon'+(file.is_text?'':' binary');icon.textContent=file.is_text?'TXT':(file.name.split('.').length>1?file.name.split('.').pop().slice(0,5).toUpperCase():'FILE');const info=document.createElement('div');info.className='file-info';const name=document.createElement('p');name.className='file-name';name.textContent=file.name;name.title=file.name;const meta=document.createElement('div');meta.className='file-meta';meta.textContent=size(file.size)+' · '+new Date(file.modified*1000).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});info.append(name,meta);const actions=document.createElement('div');actions.className='file-actions';if(file.is_text){const preview=document.createElement('button');preview.textContent='查看';preview.setAttribute('aria-label','查看 '+file.name);preview.onclick=()=>previewText(file.name);actions.append(preview)}const download=document.createElement('a');download.textContent='下载 ↓';download.href='/download/'+encodeURIComponent(file.name);download.download=file.name;download.setAttribute('aria-label','下载 '+file.name);actions.append(download);row.append(icon,info,actions);$('files').append(row)}}
async function refresh(manual=false){if(refreshing)return;refreshing=true;try{entries=await api('/api/files');$('summary').textContent=entries.length+' 个文件 · '+size(entries.reduce((n,f)=>n+f.size,0));$('connection').textContent='● 已连接到共享空间';$('connection').classList.remove('offline');render();if(manual)toast('共享空间已更新')}catch(e){$('connection').textContent='● 连接已断开';$('connection').classList.add('offline');$('summary').textContent='连接失败，请确认主机 App 正在运行';if(manual)toast(e.message,true)}finally{refreshing=false}}
function uploadOne(file,onProgress){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/upload');xhr.setRequestHeader('X-Lan-Drop','1');xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100))};xhr.onload=()=>{let result;try{result=JSON.parse(xhr.responseText)}catch{reject(new Error(xhr.responseText||'上传失败'));return}xhr.status>=200&&xhr.status<300?resolve(result):reject(new Error(result.error||'上传失败'))};xhr.onerror=()=>reject(new Error('网络中断，请检查连接后重试'));xhr.onabort=()=>reject(new Error('上传已取消'));const data=new FormData();data.append('files',file);xhr.send(data)})}
async function upload(files){files=Array.from(files);if(!files.length)return;if(uploading){toast('当前上传尚未完成，请稍后再添加文件',true);return}uploading=true;$('choose').disabled=true;$('progress-area').hidden=false;let success=0;const failed=[];try{for(let i=0;i<files.length;i++){const file=files[i];$('progress').value=0;$('progress-label').textContent=(i+1)+' / '+files.length+' · '+file.name;try{if(file.size>10*1024**3)throw new Error('单个文件不能超过 10 GiB');await uploadOne(file,p=>{$('progress').value=p;$('progress-label').textContent=(i+1)+' / '+files.length+' · '+p+'% · '+file.name});success++;await refresh()}catch(e){failed.push(file.name+'：'+e.message)}}toast(failed.length?'已共享 '+success+' 个文件\n'+failed.join('\n'):'已共享 '+success+' 个文件',!!failed.length)}finally{uploading=false;$('choose').disabled=false;$('progress-area').hidden=true;$('file-input').value='';refresh()}}
$('choose').onclick=()=>$('file-input').click();$('file-input').onchange=e=>upload(e.target.files);
let dragDepth=0;document.addEventListener('dragenter',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();dragDepth++;$('drop').classList.add('dragging')}});document.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});document.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;$('drop').classList.remove('dragging')}});document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('drop').classList.remove('dragging');const items=Array.from(e.dataTransfer.items);const hasDirectory=items.some(i=>i.webkitGetAsEntry?.()?.isDirectory);if(hasDirectory){toast('文件夹请先压缩，再上传',true);return}upload(e.dataTransfer.files)});
function updateDraft(){$('char-count').textContent=$('draft').value.length+' 字';$('save-text').disabled=saving||!$('draft').value.trim()}
$('draft').oninput=updateDraft;
$('paste').onclick=async()=>{try{if(!navigator.clipboard?.readText)throw new Error();const text=await navigator.clipboard.readText();$('draft').setRangeText(text,$('draft').selectionStart,$('draft').selectionEnd,'end');updateDraft()}catch{$('draft').focus();toast('局域网 HTTP 页面请在输入框内按 Ctrl / ⌘ + V；手机可长按粘贴')}};
$('save-text').onclick=async()=>{const text=$('draft').value;if(!text.trim())return;if(new TextEncoder().encode(text).length>1048576){toast('文字不能超过 1 MiB',true);return}saving=true;updateDraft();$('draft').disabled=true;$('paste').disabled=true;$('save-text').textContent='正在保存…';try{await api('/api/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});$('draft').value='';toast('文字已保存并共享');await refresh()}catch(e){toast(e.message,true)}finally{saving=false;$('draft').disabled=false;$('paste').disabled=false;$('save-text').textContent='保存并共享';updateDraft()}};
async function previewText(name){try{const result=await api('/api/text/'+encodeURIComponent(name));$('preview-name').textContent=name;$('preview-text').value=result.text;$('preview').showModal()}catch(e){toast(e.message,true)}}
$('close-preview').onclick=()=>$('preview').close();$('copy-preview').onclick=async()=>{const area=$('preview-text');try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(area.value);else{area.focus();area.select();if(!document.execCommand('copy'))throw new Error()}toast('文字已复制')}catch{area.focus();area.select();toast('已选中文字，请按 Ctrl / ⌘ + C 或长按复制')}};
$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button))});render()});$('refresh').onclick=()=>refresh(true);$('address').textContent=location.host;$('address').href=location.origin;window.addEventListener('beforeunload',e=>{if(uploading||saving){e.preventDefault();e.returnValue=''}});refresh();setInterval(()=>{if(!document.hidden)refresh()},2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
